name: Product CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: peddiehacks_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peddiehacks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_DATABASE_BOOTSTRAP: 'true'
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/peddiehacks_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate native app configuration
        run: pnpm --filter @peddie/mobile config:check

      - name: Unit and API tests
        run: pnpm test

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Build
        run: pnpm build

      - name: Install PostgreSQL client when unavailable
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client)

      - name: Prepare disposable PostgreSQL database
        run: pnpm db:test:prepare

      - name: Database and RLS checks
        run: pnpm test:db

      - name: Prisma RLS smoke check
        run: pnpm test:prisma
