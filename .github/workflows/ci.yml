name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and API tests
        run: pnpm test

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Build
        run: pnpm build

      - name: Database checks when a database URL is configured
        run: pnpm test:db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
